<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body class="font-resurrected" data-sveltekit-preload-data="hover">
    <!-- Applies the saved font (Header's "Aa" menu) before the first paint, so the page does not
         render in one font and switch once the app has hydrated. -->
    <script>
      try {
        var font = localStorage.getItem('font');
        if (font === 'font-classic' || font === 'font-neutral') document.body.classList.replace('font-resurrected', font);
      } catch (e) {}
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
